name: Day 59 - DevSecOps Master Security Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # GATE 1: Static Code & IaC Analysis
  iac-security-gate:
    name: 1. Terraform Security Gate (Checkov)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install & Run Checkov
      run: |
        pip install checkov
        checkov -d . --framework terraform || true

  # GATE 2: Container CVE Vulnerability Gate
  container-security-gate:
    name: 2. Container Vulnerability Gate (Trivy)
    needs: iac-security-gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Local Container Image
      run: docker build -t capstone-app:latest .

    - name: Install & Run Trivy Scanner
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy image --severity CRITICAL,HIGH capstone-app:latest || true

  # GATE 3: Automated Infrastructure Validation
  terraform-validation-gate:
    name: 3. Terraform Validation & Format Gate
    needs: container-security-gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0

    - name: Validate Terraform Syntax & Formatting
      run: |
        terraform fmt -check
        terraform init -backend=false -input=false
        terraform validate
